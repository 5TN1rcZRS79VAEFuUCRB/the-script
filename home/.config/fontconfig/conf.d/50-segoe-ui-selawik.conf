<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The desktop font is Segoe UI (install.sh sets it in kdeglobals), which is not free to ship.
     Selawik (ttf-selawik in aur.txt) is Microsoft's open stand-in with the same metrics; a real
     Segoe UI, if ever installed, still wins. -->
<fontconfig>
  <alias binding="same">
    <family>Segoe UI</family>
    <accept><family>Selawik</family></accept>
  </alias>
</fontconfig>
