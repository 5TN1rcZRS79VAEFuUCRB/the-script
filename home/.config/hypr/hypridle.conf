# the-script: what happens when the computer sits idle (hypridle, started by the-script-session).
# 10 minutes: lock; 30 seconds later the screens go off. Locks before sleep (lid closed, Suspend).
# A fullscreen game or video keeps it awake (hyprland.lua's idle_inhibit rules).

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 630
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
