# the-script: the lock screen (Super+L, the power menu, idle, before sleep). Square and dark like the bar.

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
}

background {
    monitor =
    path = ~/.local/share/wallpapers/the-script.jpg
    color = rgb(000000)
    brightness = 0.45
}

label {
    monitor =
    text = cmd[update:1000] date +'%-I:%M'
    color = rgb(ffffff)
    font_size = 96
    font_family = Adwaita Sans Light
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %B %-d'
    color = rgb(dddddd)
    font_size = 20
    font_family = Adwaita Sans
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 46
    outline_thickness = 1
    rounding = 0
    outer_color = rgb(3d3d3d)
    inner_color = rgb(1b1b1b)
    font_color = rgb(ffffff)
    check_color = rgb(3584e4)
    fail_color = rgb(e01b24)
    capslock_color = rgb(e5a50a)
    fade_on_empty = false
    placeholder_text = <span foreground="##9a9a9a">Password</span>
    fail_text = $FAIL
    font_family = Adwaita Sans
    dots_spacing = 0.3
    dots_rounding = 0
    position = 0, -20
    halign = center
    valign = center
}
