# the-script: Noctalia (the bar, notifications, lock screen, idle, wallpaper, volume/brightness popups,
# Alt+Tab). Noctalia's own look is kept; this file only wires it into the-script. Changes made in
# Noctalia's Settings window go to ~/.local/state/noctalia/settings.toml and win over this file.
# Every *.toml in this folder is read; saving applies it.

[bar.default]
# Edge to edge, square, and only the essentials; the control center (right end) has notifications,
# Bluetooth, brightness, media and the power menu. No workspaces (the-script uses one). The launcher
# button opens the-script's overview (left click) or Noctalia's own launcher (right click).
margin_ends = 0
radius = 0
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 0
radius_bottom_right = 0
start = ["launcher", "active_window"]
center = ["clock"]
end = ["todo", "tray", "network", "volume", "battery", "control-center"]

[widget.launcher.actions]
left = "exec qs ipc call overview toggle"
right = "panel-toggle launcher"

[widget.clock]
format = "{:%a %b %-d  %-I:%M %p}"

[widget.todo]
type = "the-script/todo:bar"

[shell]
polkit_agent = true            # password prompts for apps that need root
setup_wizard_enabled = false   # the-script sets it up
time_format = "{:%I:%M %p}"

[shell.window_switcher]
mru = true                     # Alt+Tab: most recently used first

[battery]
warning_threshold = 10

# Locked after 10 minutes idle, screens off 30 seconds later; locked before sleep.
[idle]
behavior_order = ["lock", "screen-off"]

[idle.behavior.lock]
action = "lock"
timeout = 600
enabled = true

[idle.behavior.screen-off]
action = "screen_off"
timeout = 630
enabled = true

[lockscreen]
enabled = true
lock_before_suspend = true

[wallpaper]
enabled = true
fill_mode = "crop"

[wallpaper.default]
path = "~/.local/share/wallpapers/the-script.jpg"

# The-script's Super overview (Quickshell) takes its colors from Noctalia's palette through this.
[theme.templates.user.the-script-overview]
input_path = "~/.config/noctalia/templates/overview-colors.json"
output_path = "~/.cache/the-script/noctalia-colors.json"

[plugins]
enabled = ["the-script/todo"]

[[plugins.source]]
enabled = true
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
name = "official"

[[plugins.source]]
enabled = true
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"
name = "community"

[[plugins.source]]
enabled = true
kind = "path"
location = "~/.local/share/the-script-plugins"
name = "the-script"
