<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2400" width="3840" height="2400">
<!-- the-script's wallpaper: a ThinkPad keyboard in the dark, the TrackPoint between G, H and B. -->
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="75%">
    <stop offset="0" stop-color="#161616"/><stop offset="1" stop-color="#060606"/>
  </radialGradient>
  <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1e1e1e"/><stop offset="1" stop-color="#141414"/>
  </linearGradient>
  <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1c1c1c"/><stop offset="1" stop-color="#191919"/>
  </linearGradient>
  <radialGradient id="fade" cx="50%" cy="50%" r="50%">
    <stop offset="0.25" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
  </radialGradient>
  <mask id="vignette"><rect width="3840" height="2400" fill="url(#fade)"/></mask>
  <radialGradient id="nub" cx="42%" cy="38%" r="65%">
    <stop offset="0" stop-color="#f0362c"/><stop offset="0.7" stop-color="#d0201a"/><stop offset="1" stop-color="#8e120d"/>
  </radialGradient>
  <pattern id="grip" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="4.5" fill="#000" fill-opacity="0.28"/>
  </pattern>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="3840" height="2400" fill="url(#bg)"/>
<g mask="url(#vignette)">
