[General]
__userfile__=true

[panel1]
plugins=mainmenu,taskbar,statusnotifier,todo,battery,audio,worldclock
alignment=-1
animation-duration=0
desktop=0
hidable=false
iconSize=20
lineCount=1
lockPanel=false
opacity=100
panelSize=30
position=Bottom
reserve-space=true
width=100
width-percent=true

[mainmenu]
filterClear=true
type=mainmenu
alignment=Left
showText=true
text=Start
filterMenu=true
filterShow=true

[taskbar]
type=taskbar
alignment=Left
buttonStyle=IconText
buttonWidth=180
closeOnMiddleClick=true
groupingEnabled=false
showGroupOnHover=false

[statusnotifier]
type=statusnotifier
alignment=Right

[worldclock]
type=worldclock
alignment=Right
formatType=custom-timeonly
timeAMPM=true
timePadHour=false
timeShowSeconds=false
showDate=false
showTimezone=false

[battery]
type=customcommand
alignment=Right
command=/home/gavin/.local/bin/battery-text
runWithBash=false
repeat=true
repeatTimer=30
outputFormat=2
click=lxqt-config-powermanagement

[audio]
type=customcommand
alignment=Right
command=/home/gavin/.local/bin/audio-status watch
continuousOutput=true
runWithBash=false
repeat=false
outputFormat=2
click=wtype -M ctrl -M alt -M logo -k F11 -m logo -m alt -m ctrl
wheelUp=/home/gavin/.local/bin/audio-status up
wheelDown=/home/gavin/.local/bin/audio-status down

[todo]
type=customcommand
alignment=Right
command=/home/gavin/.local/bin/todo-count
runWithBash=false
repeat=true
repeatTimer=1
outputFormat=2
click=wtype -M ctrl -M alt -M logo -k F10 -m logo -m alt -m ctrl
